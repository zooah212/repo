<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>词库桥接 KeyBridge</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f2f2f7; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .meta { color: #666; margin-bottom: 24px; }
  .section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .section h2 { margin-top: 0; font-size: 18px; color: #333; }
  .version { margin-bottom: 16px; }
  .version:last-child { margin-bottom: 0; }
  .version-title { font-weight: 600; color: #007aff; }
  ul { padding-left: 20px; margin: 8px 0 0; }
  li { margin: 4px 0; }
  a { color: #007aff; }
</style>
</head>
<body>
  <h1>词库桥接 KeyBridge</h1>
  <div class="meta">by wm0104 · 版本 0.0.3</div>

  <div class="section">
    <h2>描述</h2>
    <p>为苹果原生中文键盘接入本地 Rime 词库，支持 26 键全拼与九宫格。</p>
    <p>兼容测试范围：iOS 15.0–16.x；目前仅在 iOS 16.3（roothide）真机验证。</p>
    <p>特别感谢 i_82（Apelin 作者）提供的开发支持。</p>
    <p>插件 fork 自 @wm0104/keybridge，只为适配 ios15 系统</p>
  </div>

  <div class="section">
    <h2>更新日志</h2>
    <div class="version">
      <span class="version-title">0.0.3</span>
      <ul>
        <li>适配 ios15 系统</li>
      </ul>
    </div>
  </div>
</body>
</html>
