<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SwipeDeck</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f2f2f7; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .meta { color: #666; margin-bottom: 24px; }
  .section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .section h2 { margin-top: 0; font-size: 18px; color: #333; }
  .version { margin-bottom: 16px; }
  .version:last-child { margin-bottom: 0; }
  .version-title { font-weight: 600; color: #007aff; }
  .version-date { color: #888; font-size: 13px; margin-left: 8px; }
  ul { padding-left: 20px; margin: 8px 0 0; }
  li { margin: 4px 0; }
  a { color: #007aff; }
</style>
</head>
<body>
  <h1>SwipeDeck</h1>
  <div class="meta">by zooah212 · 版本 0.3.1</div>

  <div class="section">
    <h2>描述</h2>
    <p>SwipeDeck 是一个快捷面板插件，面板支持添加多种类型的功能按钮，包括系统安装的 app 应用、快捷指令、自定义 shell 命令以及一些内置的功能按钮。</p>
    <p>面板支持多种方式触发显示，同时支持多种面板主题。后续会增加更多功能，欢迎大家使用！</p>
  </div>

  <div class="section">
    <h2>更新日志</h2>
    <div class="version">
      <span class="version-title">0.3.1</span>
      <span class="version-date">2026-09-16</span>
      <ul>
        <li>首个公开版本发布</li>
      </ul>
    </div>
  </div>
</body>
</html>
